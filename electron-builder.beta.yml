appId: com.genealogico.archivo-beta
productName: Archivo Genealógico Beta
copyright: Copyright © 2026

directories:
  output: release

files:
  - electron/dist/**
  - backend/dist/**
  - frontend/dist/**
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

asar: false

publish:
  provider: github
  owner: TomasMorenoo
  repo: archivo-genealogico
  releaseType: prerelease
